openapi: 3.0.3
info:
  title: golang-code-challenge
  version: 1.0.0
  description: |
    Code-Challenge: REST-Service zur Verwaltung einer Schadenfallliste.

    Die Endpoints unter `/greeting` sind die mitgelieferten **Beispiel-Endpoints**
    und dienen als Vorlage.

    Die Endpoints unter `/schadenfaelle` sind **noch nicht implementiert** und
    Teil der Aufgabenstellung. Sie sind hier als Zielbild vorskizziert – die
    konkrete Ausgestaltung (Felder, Statuscodes, Fehlerformat) darf begründet
    abweichen.

servers:
  - url: http://localhost:8080/code-challenge
    description: Lokale Entwicklungsumgebung

tags:
  - name: greeting
    description: Beispiel-Endpoints (Vorlage)
  - name: schadenfall
    description: Schadenfallverwaltung (zu implementieren)

paths:
  /greeting:
    get:
      tags: [greeting]
      operationId: getGreeting
      summary: Begrüßung über Query-Parameter
      parameters:
        - name: name
          in: query
          required: true
          description: Name der zu begrüßenden Person (max. 100 Zeichen)
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: Welt
      responses:
        '200':
          description: Begrüßung erfolgreich erzeugt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GreetingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [greeting]
      operationId: postGreeting
      summary: Begrüßung über JSON-Body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GreetingRequest'
      responses:
        '200':
          description: Begrüßung erfolgreich erzeugt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GreetingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      operationId: getHealth
      summary: Liveness-Probe
      responses:
        '200':
          description: Service verarbeitet Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    GreetingRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Welt

    GreetingResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Hallo, Welt!

    SchadenfallRequest:
      type: object
      description: Eingabe-DTO für das Anlegen/Aktualisieren eines Schadenfalls.
      required: [artDesSchadens, datumDesEintrags]
      properties:
        artDesSchadens:
          type: string
          description: Art des Schadens
          minLength: 1
          maxLength: 100
          example: Wasserschaden im Keller
        datumDesEintrags:
          type: string
          description: Datum des Eintrags im Format DD.MM.YYYY
          pattern: '^\d{2}\.\d{2}\.\d{4}$'
          example: '24.11.2026'

    Schadenfall:
      type: object
      description: Ausgabe-DTO eines Schadenfalls.
      required: [id, artDesSchadens, datumDesEintrags]
      properties:
        id:
          type: string
          description: Technische ID des Schadenfalls
          example: '1'
        artDesSchadens:
          type: string
          maxLength: 100
          example: Wasserschaden im Keller
        datumDesEintrags:
          type: string
          pattern: '^\d{2}\.\d{2}\.\d{4}$'
          example: '24.11.2026'

    HealthResponse:
      type: object
      required: [status, stage]
      properties:
        status:
          type: string
          example: UP
        stage:
          type: string
          example: dev

    ErrorResponse:
      type: object
      description: |
        Einheitliches Fehlerformat. Enthält bewusst keine technischen Details,
        um keine internen Strukturen oder personenbezogenen Daten offenzulegen.
      required: [message]
      properties:
        message:
          type: string
          example: bad request

  responses:
    BadRequest:
      description: Die Anfrage ist ungültig
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Die angefragte Ressource existiert nicht
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Unerwarteter Serverfehler
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
